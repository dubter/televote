name: televote

x-app-env: &app-env
  ENV: dev
  LOG_LEVEL: info
  HTTP_ADDR: ":8080"
  DEBUG_ADDR: "off"
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: votes
  REDIS_ADDRS: redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379,redis-6:6379
  POSTGRES_DSN: postgres://televote:televote@postgres:5432/televote?sslmode=disable
  POSTGRES_READ_DSN: postgres://televote:televote@postgres:5432/televote?sslmode=disable
  PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8080}
  ASN_BLOCK_ENABLED: "false"
  RATE_LIMIT_PER_MIN: "10000000"
  SNAPSHOT_INTERVAL: 2s
  SNAPSHOT_FINAL_GRACE: 5s
  DRAIN_WINDOW: 5m
  POLL_CONFIG_REFRESH: 1s
  POLL_MIN_LEAD_TIME: 0s
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
  OTEL_TRACE_SAMPLE_RATIO: "1"
  ADMIN_JWT_KEY: 6465762d6f6e6c792d6a77742d6b65792d666f722d7468652d6c6f63616c2d7374616e64
  ADMIN_BOOTSTRAP_LOGIN: admin
  ADMIN_BOOTSTRAP_PASSWORD: dev-only-change-me

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    kafka-init: { condition: service_completed_successfully }
    redis-init: { condition: service_completed_successfully }
  healthcheck:
    interval: 5s
    timeout: 3s
    retries: 12

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: televote
      POSTGRES_PASSWORD: televote
      POSTGRES_DB: televote
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U televote -d televote"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/migrate", "-command", "up"]
    environment:
      POSTGRES_DSN: postgres://televote:televote@postgres:5432/televote?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MINUTES: 10
      CLUSTER_ID: televote-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic votes --partitions 6 --replication-factor 1

  redis-1: &redis
    image: redis:8-alpine
    command: ["redis-server", "/etc/redis/redis.conf"]
    volumes: ["./redis.conf:/etc/redis/redis.conf:ro"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis-2: *redis
  redis-3: *redis
  redis-4: *redis
  redis-5: *redis
  redis-6: *redis

  redis-init:
    image: redis:8-alpine
    restart: "no"
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
    command: >
      sh -c "redis-cli --cluster create
      $$(getent hosts redis-1 | awk '{print $$1}'):6379
      $$(getent hosts redis-2 | awk '{print $$1}'):6379
      $$(getent hosts redis-3 | awk '{print $$1}'):6379
      $$(getent hosts redis-4 | awk '{print $$1}'):6379
      $$(getent hosts redis-5 | awk '{print $$1}'):6379
      $$(getent hosts redis-6 | awk '{print $$1}'):6379
      --cluster-replicas 1 --cluster-yes || true"

  app-1:
    <<: *app
    entrypoint: ["/api"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      <<: *app-env
      INSTANCE: app-1
    networks:
      default:
        aliases: [api]
    ports: ["${APP1_PORT:-8081}:8080"]

  app-2:
    <<: *app
    entrypoint: ["/api"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      <<: *app-env
      INSTANCE: app-2
    networks:
      default:
        aliases: [api]
    ports: ["${APP2_PORT:-8082}:8080"]

  consumer:
    <<: *app
    entrypoint: ["/consumer"]
    healthcheck:
      test: ["CMD", "/consumer", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      <<: *app-env
      INSTANCE: consumer
    deploy:
      replicas: 2

  snapshot:
    <<: *app
    entrypoint: ["/snapshot"]
    healthcheck:
      test: ["CMD", "/snapshot", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      <<: *app-env
      INSTANCE: snapshot
    deploy:
      replicas: 1

  lb:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      app-1: { condition: service_started }
      app-2: { condition: service_started }

  otel-lgtm:
    image: grafana/otel-lgtm:0.6.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "4317:4317"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana-v11.0.0/conf/provisioning/dashboards/televote.yaml:ro
      - ./grafana/televote.json:/etc/grafana/televote/televote.json:ro

  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    volumes: ["../load/k6:/scripts:ro"]
    environment:
      BASE_URL: http://lb:8080
      INSTANCES: app-1:8080,app-2:8080
    depends_on:
      lb: { condition: service_started }
