# Балансировщик стенда: два инстанса приёма за одним адресом.
#
# Прямые порты инстансов остаются доступными снаружи — smoke-тест бьёт в
# разные инстансы одним и тем же voter, чтобы доказать, что дедуп не зависит
# от того, кто принял голос.

events { worker_connections 4096; }

http {
    upstream televote {
        server app-1:8080 max_fails=2 fail_timeout=5s;
        server app-2:8080 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }

    # Приложение доверяет X-Forwarded-For только от известных прокси, поэтому
    # адрес клиента обязан проставить именно балансировщик.
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://televote;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
