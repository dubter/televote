# Конфигурация ноды Redis Cluster для стенда.
#
# Значения здесь не косметика: три из них закрывают тихие отказы, которые не
# видны ни в тестах, ни в логах (CLAUDE.md, таблица инвариантов).

cluster-enabled yes
cluster-config-file nodes.conf
appendonly yes
appendfsync everysec
save ""

# noeviction обязателен: при любой политике вытеснения Redis начнёт выбрасывать
# дедуп-ключи под давлением памяти, и повторные голоса молча пойдут в счёт.
# Отказ в записи виден сразу, тихая накрутка — никогда.
maxmemory 512mb
maxmemory-policy noeviction

# Падение одной ноды не должно останавливать весь опрос: при full-coverage yes
# кластер отказывается обслуживать любые запросы, пока не покрыты все слоты.
cluster-require-full-coverage no

# Дефолтные 15 секунд означают до 30 секунд недоступности шарда — половину
# эфира. Пять секунд сокращают простой примерно до восьми.
cluster-node-timeout 5000

# Единственный источник fork на горячем пути — переписывание AOF. В окне эфира
# он отключён; после эфира запускается вручную через BGREWRITEAOF.
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 0
