# Конфиг коллектора внутри grafana/otel-lgtm:0.6.0, дополненный одним скрейпом.
# Трейсы и логи приложение шлёт по OTLP само, а метрики отдаёт на /metrics —
# без этого job панели Prometheus остаются пустыми.
receivers:
  otlp:
    protocols:
      grpc:
      http:
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: 'opentelemetry-collector'
          static_configs:
            - targets: ['localhost:8888']
        - job_name: 'televote'
          scrape_interval: 5s
          static_configs:
            - targets: ['app-1:8080', 'app-2:8080']

processors:
  batch:

exporters:
  otlphttp/metrics:
    endpoint: http://localhost:9090/api/v1/otlp
  otlphttp/traces:
    endpoint: http://localhost:4418
  otlphttp/logs:
    endpoint: http://localhost:3100/otlp
  logging/metrics:
    verbosity: detailed
  logging/traces:
    verbosity: detailed
  logging/logs:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
      #exporters: [otlphttp/traces,logging/traces]
    metrics:
      receivers: [otlp,prometheus/collector]
      processors: [batch]
      exporters: [otlphttp/metrics]
      #exporters: [otlphttp/metrics,logging/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
      #exporters: [otlphttp/logs,logging/logs]
