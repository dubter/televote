version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck        # непроверенные ошибки
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive          # стиль
    - gocritic
    - gosec           # безопасность
    - bodyclose       # незакрытые response body
    - contextcheck    # потерянный context
    - noctx           # запросы без context
    - nilerr          # return nil при ненулевой ошибке
    - errorlint       # сравнение ошибок без errors.Is
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    - prealloc
    - depguard        # границы слоёв

  settings:
    depguard:
      rules:
        # domain не импортирует НИЧЕГО из проекта и почти ничего извне.
        # Список allow исчерпывающий: что не разрешено — запрещено.
        #
        # Тесты исключены: они живут в пакете domain_test, импортируют сам
        # domain и testify, и это не нарушение границы, а способ её проверить.
        domain-is-pure:
          files:
            - "**/internal/domain/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/google/uuid
        # Бизнес-слой не знает про HTTP.
        no-http-in-core:
          files:
            - "**/internal/vote/**"
            - "**/internal/ballot/**"
            - "**/internal/snapshot/**"
            - "**/internal/pollcfg/**"
          deny:
            - pkg: net/http
              desc: "HTTP живёт только в internal/httpapi; бизнес-слой о нём не знает"
        # В проекте один логгер — log/slog из stdlib. Сторонние тянут за собой
        # свой формат вывода, и структурированные записи перестают
        # коррелироваться с трейсами по trace_id.
        single-logger:
          files:
            - "**/internal/**"
            - "**/cmd/**"
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: "в проекте один логгер — log/slog"
            - pkg: go.uber.org/zap
              desc: "в проекте один логгер — log/slog"
            - pkg: github.com/rs/zerolog
              desc: "в проекте один логгер — log/slog"

    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: unexported-return
        - name: var-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam       # на горячем пути параметры и так по указателю
        - whyNoLint

    gosec:
      excludes:
        - G115           # конверсии целых проверяются доменной валидацией

    errcheck:
      check-type-assertions: true
      check-blank: true

  exclusions:
    generated: lax
    rules:
      # В тестах другой набор компромиссов: фикстуры возвращают несколько
      # значений без имён, запросы строятся без контекста, тела пустые.
      # Это шум, а не дефекты, и он прячет настоящие находки.
      - path: _test\.go
        linters:
          - gosec
          - prealloc
          - errcheck
          - noctx
          - gocritic
          - contextcheck
      # Lua-скрипт встроен строкой — gosec видит в нём «команду».
      - path: internal/vote/script\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OWNER/televote
