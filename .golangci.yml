version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gocritic
    - gosec
    - bodyclose
    - contextcheck
    - noctx
    - nilerr
    - errorlint
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    - prealloc
    - depguard

  settings:
    depguard:
      rules:
        domain-is-pure:
          files:
            - "**/internal/domain/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/google/uuid
        service-is-infra-free:
          files:
            - "**/internal/service/**"
            - "**/internal/domain/**"
          deny:
            - pkg: net/http
              desc: "HTTP lives only in internal/transport; use cases must not know about it"
            - pkg: github.com/redis/rueidis
              desc: "Redis lives only in internal/adapter/redis; use cases see domain types and errors"
            - pkg: github.com/jackc/pgx/v5
              desc: "Postgres lives only in internal/adapter/postgres; use cases see repository interfaces"
            - pkg: github.com/twmb/franz-go
              desc: "Kafka lives in internal/adapter/producer and internal/worker/kafka; use cases see interfaces"
            - pkg: github.com/dubter/televote/internal/adapter
              desc: "use cases declare the interfaces adapters implement, never the reverse"
            - pkg: github.com/dubter/televote/internal/transport
              desc: "transport calls use cases, never the reverse"
            - pkg: github.com/dubter/televote/internal/worker
              desc: "workers call use cases, never the reverse"
        transport-and-workers-call-services:
          files:
            - "**/internal/transport/**"
            - "**/internal/worker/**"
          deny:
            - pkg: github.com/redis/rueidis
              desc: "handlers and workers talk to use cases, never to Redis directly"
            - pkg: github.com/jackc/pgx/v5
              desc: "handlers and workers talk to use cases, never to Postgres directly"
            - pkg: github.com/dubter/televote/internal/adapter
              desc: "handlers and workers depend on use cases and domain, not on adapters"
        transport-has-no-kafka:
          files:
            - "**/internal/transport/**"
          deny:
            - pkg: github.com/twmb/franz-go
              desc: "handlers publish through the voting use case, never through kgo directly"
        single-logger:
          files:
            - "**/internal/**"
            - "**/cmd/**"
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: "the project has one logger: log/slog"
            - pkg: go.uber.org/zap
              desc: "the project has one logger: log/slog"
            - pkg: github.com/rs/zerolog
              desc: "the project has one logger: log/slog"

    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: unexported-return
        - name: var-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - whyNoLint

    gosec:
      excludes:
        - G115

    errcheck:
      check-type-assertions: true
      check-blank: true

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - prealloc
          - errcheck
          - noctx
          - gocritic
          - contextcheck
      - path: internal/service/vote/script\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dubter/televote
