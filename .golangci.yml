version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gocritic
    - gosec
    - bodyclose
    - contextcheck
    - noctx
    - nilerr
    - errorlint
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
    - prealloc
    - depguard

  settings:
    depguard:
      rules:
        domain-is-pure:
          files:
            - "**/internal/domain/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/google/uuid
        no-http-in-core:
          files:
            - "**/internal/vote/**"
            - "**/internal/ballot/**"
            - "**/internal/snapshot/**"
            - "**/internal/pollcfg/**"
          deny:
            - pkg: net/http
              desc: "HTTP живёт только в internal/httpapi; бизнес-слой о нём не знает"
        single-logger:
          files:
            - "**/internal/**"
            - "**/cmd/**"
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: "в проекте один логгер — log/slog"
            - pkg: go.uber.org/zap
              desc: "в проекте один логгер — log/slog"
            - pkg: github.com/rs/zerolog
              desc: "в проекте один логгер — log/slog"

    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: unexported-return
        - name: var-naming

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - whyNoLint

    gosec:
      excludes:
        - G115

    errcheck:
      check-type-assertions: true
      check-blank: true

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
          - prealloc
          - errcheck
          - noctx
          - gocritic
          - contextcheck
      - path: internal/vote/script\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dubter/televote
