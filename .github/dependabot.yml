version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      otel:
        patterns: ["go.opentelemetry.io/*"]
      testing:
        patterns: ["github.com/stretchr/*", "github.com/testcontainers/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
