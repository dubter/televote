name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

permissions:
  contents: read

jobs:
  lint:
    name: линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: unit с детектором гонок
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: порог покрытия
        run: |
          grep -v '/mocks/' coverage.out > coverage.filtered
          pct=$(go tool cover -func=coverage.filtered | tail -1 | grep -oE '[0-9.]+' | head -1)
          echo "покрытие: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 45) ? 0 : 1 }' \
            || { echo "::error::покрытие ниже 45%"; exit 1; }

  integration:
    name: интеграционные
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -tags=integration -count=1 -timeout=12m ./...

  vuln:
    name: уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    name: стенд и smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: поднять стенд
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: дождаться готовности и создать демо-опрос
        run: ./scripts/demo.sh
        env:
          WAIT_TIMEOUT: "300"
      - name: smoke
        run: ./scripts/smoke.sh
      - name: логи при провале
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
      - name: остановить стенд
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  docker:
    name: образ
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: televote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
