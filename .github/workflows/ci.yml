name: ci

on:
  push:
    branches: [main]
  pull_request:

# Отменяем предыдущий прогон той же ветки: держать очередь из устаревших
# сборок дороже, чем перезапустить актуальную.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

permissions:
  contents: read

jobs:
  lint:
    name: линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2
          args: --timeout=5m

  test:
    name: тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: unit с детектором гонок
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      # Порог — храповик против регресса, а не цель сам по себе. Адаптеры
      # (cmd/, storage/postgres) юнит-тестами не покрыты намеренно: их
      # проверяет job e2e, который гоняет настоящий стенд.
      - name: порог покрытия
        run: |
          pct=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9.]+' | head -1)
          echo "покрытие: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 45) ? 0 : 1 }' \
            || { echo "::error::покрытие ниже 45%"; exit 1; }

  vuln:
    name: уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Главная проверка: стенд поднимается одной командой, и на нём проходит
  # smoke — включая шаг, где один голосующий бьёт в два разных инстанса и
  # обязан получить ровно один голос после дренажа.
  e2e:
    name: стенд и smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: поднять стенд
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: дождаться готовности
        run: ./scripts/wait-ready.sh
        env:
          WAIT_TIMEOUT: "300"
      - name: smoke
        run: ./scripts/smoke.sh
      - name: логи при провале
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
      - name: остановить стенд
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  docker:
    name: образ
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: televote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
