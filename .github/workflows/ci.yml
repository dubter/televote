name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: порог покрытия
        run: |
          pct=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9.]+')
          echo "покрытие: $pct%"
          awk -v p="$pct" 'BEGIN{exit (p+0 >= 70) ? 0 : 1}' || {
            echo "покрытие ниже 70%"; exit 1; }

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # testcontainers поднимает Redis Cluster и Postgres сам.
      # Кластер обязателен: single-node не воспроизводит CROSSSLOT.
      - run: go test -race -count=1 -tags=integration -timeout=15m ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: televote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
